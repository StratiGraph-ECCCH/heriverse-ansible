---
# ───────────────────────────────────────────────────────────────────────────────
# LE CREDENZIALI, CHIESTE PRIMA DI TOCCARE L'HOST
#
# I defaults promettono, in maiuscolo, che «the template fails loudly if the
# documents store is enabled and they are missing». E fallisce — ma tardi e con
# la voce sbagliata. Misurato togliendo `em_documents_password` alla prima
# esecuzione vera di questo ruolo (15-09-2026):
#
#     TASK [Replace docker-compose.yml for prod]
#     fatal: 'em_documents_password' is undefined
#
# È il SETTIMO compito. Prima di allora il ruolo ha già installato due pacchetti,
# creato un utente di sistema e clonato un repository su una macchina che poi non
# riceverà nessun deployment. E il messaggio nomina la variabile e nient'altro:
# non dice che è la credenziale del database dei documenti, non dice che va
# nell'inventario o nel Vault, non dice che i defaults la lasciano fuori apposta.
#
# Questo compito è la stessa forma del preflight del realm poco più sotto: legge
# delle variabili, non chiama niente, funziona in `--check`, e dice **cosa manca
# e dove va**. Costa un compito e sposta il rifiuto dal settimo posto al primo.
- name: Work out which credentials this deployment needs and has not been given
  ansible.builtin.set_fact:
    em_missing_credentials: >-
      {{ ( (['em_documents_user', 'em_documents_password']
             if (em_server_enabled | default(false))
                and (em_documents_enabled | default(false)) else [])
         + (['minio_root_user', 'minio_root_password']
             if (minio_enabled | default(false)) else [])
         + (['couchdb_user', 'couchdb_password']
             if (em_catalog_enabled | default(false))
                and (em_catalog_couchdb_enabled | default(false)) else []) )
         | reject('in', hostvars[inventory_hostname] | list) | list }}
  tags: [credentials-preflight]

- name: Refuse to deploy without the credentials the defaults leave out on purpose
  ansible.builtin.fail:
    msg: |-
      {{ em_missing_credentials | length }} credential(s) this deployment needs are not defined anywhere:
      {% for name in em_missing_credentials %}
          {{ name }}
      {% endfor %}
      They are NOT in defaults/main.yml and they never will be — a secret in a
      repository is a secret that has already leaked. Provide them from the
      inventory (`group_vars/<group>/vault.yml`), an Ansible Vault file, or the
      environment.

      Said HERE rather than where the template would notice, which is seven tasks
      later: by then this host has two new packages, a system user and a clone of
      somebody else's repository, and no deployment.

      If a store is not wanted on this node, turn it OFF (em_documents_enabled,
      minio_enabled, em_catalog_couchdb_enabled) rather than leaving its
      credentials blank: off is a decision and blank is an accident.
  when: em_missing_credentials | default([]) | length > 0
  tags: [credentials-preflight]
# ───────────────────────────────────────────────────────────────────────────────

- name: Ensure ACL is installed
  ansible.builtin.package:
    name:
      - acl
    state: present
    update_cache: yes

- name: Ensure git is installed
  ansible.builtin.package:
    name:
      - git
    state: present
    update_cache: yes

- name: Create Heriverse user
  ansible.builtin.user:
    name: heriverse
    shell: /usr/sbin/nologin
    home: /opt/heriverse
    create_home: true
    password: '*'

# Probably not necessary
- name: Ensure Heriverse directory exists
  ansible.builtin.file:
    path: "{{ heriverse_checkout }}"
    state: directory
    owner: heriverse
    group: heriverse
    mode: "0755"

# `force: true`, E NON È UN DETTAGLIO: due compiti più in basso questo ruolo
# RISCRIVE due file che quel clone ha in git — `docker-compose.yml` e
# `mount/caddy/Caddyfile`. Senza `force`, la SECONDA esecuzione muore qui:
#
#     Local modifications exist in the destination:
#     /opt/heriverse/docker-heriverse (force=no).
#
# Misurato alla seconda esecuzione, la prima volta che questo ruolo è stato
# eseguito due volte di fila (15-09-2026). Prima della correzione ai `dest` il
# difetto era invisibile: il ruolo scriveva `docker-compose.yml.j2`, un file NON
# tracciato, quindi git restava pulito — cioè il playbook era idempotente perché
# non faceva niente.
#
# Il verso di `force` è quello giusto per un host gestito: la verità è il
# playbook, e una modifica fatta a mano sulla macchina è esattamente ciò che una
# riesecuzione deve cancellare. Il costo è che i due compiti di template
# riportano `changed` a ogni giro — rifanno un lavoro che git ha appena disfatto
# — e questo è rumore dichiarato, non un difetto nascosto.
- name: Clone Heriverse repo
  ansible.builtin.git:
    repo: "{{ heriverse_repo_url }}"
    dest: "{{ heriverse_checkout }}"
    clone: true
    force: true
  become: true
  become_user: heriverse

# The dissemination reader is an artefact built in another repo and copied onto
# this host. If the variable names a path that is not there, Docker will happily
# create an empty directory and mount it, and StratiGraph Catalog will answer 501 while
# the configuration says a reader is installed. Say it at deploy time, when
# somebody is watching, rather than in a browser three days later.
- name: Look for the reader dist named by em_catalog_reader_dist
  ansible.builtin.stat:
    path: "{{ em_catalog_reader_dist }}/reader.html"
  register: em_catalog_reader_shell
  when: em_catalog_reader_dist | default('') | length > 0

- name: Refuse to deploy a reader that is not on this host
  ansible.builtin.fail:
    msg: >-
      em_catalog_reader_dist is {{ em_catalog_reader_dist }}, but
      {{ em_catalog_reader_dist }}/reader.html is not there. Build it with
      `npm run build:reader` in EMStudio and copy the WHOLE dist/ (the shell and
      its assets/) to that path — or leave the variable empty, which serves an
      honest 501 instead.
  when:
    - em_catalog_reader_dist | default('') | length > 0
    - not em_catalog_reader_shell.stat.exists

# ───────────────────────────────────────────────────────────────────────────────
# THE REALM THIS ROLE DOES NOT OWN — asserted, never written.
#
# This role rewrites the compose file and the Caddyfile. It does NOT rewrite the
# realm: that arrives inside `docker-heriverse` (cloned above) and belongs to 3DR.
# `git ls-files | grep -i realm` in this repo finds nothing, and that is correct.
#
# But the realm is the thing that decides who may enter every StratiGraph surface,
# and Caddy sends `/em/*` to StratiGraph Server in one block — so a page added to
# stratigraph-server is served here the moment it is deployed, and the identity
# provider has never heard of it. Measured on the dev stack on 7 September 2026,
# a day after two doors were born:
#
#     /em/work/    400  Invalid parameter: redirect_uri
#     /em/tools/   400  Invalid parameter: redirect_uri
#     /em/rooms/   302
#     /em/admin/   302
#     /em/studio/  302
#
# In production that is discovered in a browser, days later, by somebody who does
# not know a realm exists. So: SAY IT AT DEPLOY TIME, when somebody is watching —
# the same reasoning, and the same shape, as the `em_catalog_reader_dist` check
# above.
#
# NOTHING HERE CALLS KEYCLOAK. These tasks read a file, so they work in `--check`
# and need no administrator password. And nothing here EDITS the realm: patching
# somebody else's repo in place is how two copies of a realm come to exist, and
# then the defect is no longer «a door is missing» but «two realms disagree and
# the last deploy wins».
#
# THE PATH IS THE ONE THE COMPOSE MOUNTS, spelled the same way
# (`docker-compose.yml.j2`: `./mount/keycloak/realms/realm-heriverse.json`). It is
# a literal there while `em_server_realm` is a variable — which is precisely the
# mismatch the third assertion below exists to catch.
- name: Read the realm that docker-heriverse brings
  ansible.builtin.slurp:
    src: "{{ heriverse_checkout }}/mount/keycloak/realms/realm-heriverse.json"
  register: em_server_realm_slurp
  failed_when: false
  check_mode: false
  tags: [realm-preflight]

- name: Refuse to deploy without the realm this stack imports
  ansible.builtin.fail:
    msg: >-
      {{ heriverse_checkout }}/mount/keycloak/realms/realm-heriverse.json
      is not on this host, and the compose file mounts it into Keycloak with
      `--import-realm`. That file comes from {{ heriverse_repo_url }}, NOT from
      this repository — so it is not missing from your checkout of the playbook,
      it is missing from the clone. Ask whoever maintains that repo, or check the
      clone above succeeded. Deploying without it starts a Keycloak with no realm,
      and every StratiGraph surface then refuses everybody.
  when: em_server_realm_slurp.content is not defined
  tags: [realm-preflight]

# A TRUNCATED CLONE IS A PLAUSIBLE MONDAY, and `from_json` on half a file
# produces «The filter plugin 'ansible.builtin.from_json' failed: Expecting
# property name enclosed in double quotes: line 1 column 3 (char 2)» — measured,
# with a fixture holding the first eleven characters of a realm. That sends
# whoever reads it into Ansible's internals for a problem that is entirely about
# the file the clone brought, so the validity is asked first and said in the terms
# of the thing that is wrong.
# A BLOCK WITH A RESCUE, and not a `failed_when`, because the first attempt at
# this did not work and the measurement said why: `from_json` explodes while
# Ansible is FINALISING THE TASK ARGUMENTS, before the module runs, so
# `failed_when: false` never gets a turn. The error reached the operator as
# «Finalization of task args for 'ansible.builtin.set_fact' failed: … Expecting
# property name enclosed in double quotes: line 1 column 3 (char 2)» — Ansible's
# internals for a problem that is entirely about the file the clone brought.
- name: Parse the realm the clone brought
  when: em_server_realm_slurp.content is defined
  tags: [realm-preflight]
  block:
    - name: Parse the realm
      ansible.builtin.set_fact:
        em_server_realm_json: >-
          {{ em_server_realm_slurp.content | b64decode | from_json }}
  rescue:
    - name: Refuse a realm file that is not valid JSON
      ansible.builtin.fail:
        msg: >-
          {{ heriverse_checkout }}/mount/keycloak/realms/realm-heriverse.json is
          on this host but is not valid JSON, so Keycloak will not import it and
          will start with no realm — after which every StratiGraph surface
          refuses everybody. A partial or truncated file is usually the clone:
          check {{ heriverse_repo_url }} and the `git` task above. Do not repair
          it by hand on the host — the next import overwrites the repair.

# WHICH REALM DOES THAT FILE ACTUALLY DECLARE? `em_server_realm` is what
# StratiGraph Server validates tokens against, and the mounted filename is a
# literal — so a deployment that renamed the realm keeps validating against a
# realm nobody imported. Same class of defect this repo already fears out loud:
# «two configs for one realm is how one of them ends up wrong».
- name: Refuse a realm file that declares a different realm
  ansible.builtin.fail:
    msg: >-
      The realm file declares realm
      "{{ em_server_realm_json.realm | default('(none)') }}", but this deployment
      validates tokens against "{{ em_server_realm }}"
      (em_server_realm → em_server_token_endpoint). One of the two is wrong, and
      nothing downstream can tell which: StratiGraph Server would fetch keys for a
      realm that was never imported and refuse every token as unsigned.
    # …and the remedy is a choice, not a guess: either set em_server_realm to the
    # realm that file declares, or get a realm file for the one you meant.
  when:
    - em_server_realm_json is defined
    - em_server_realm_json.realm | default('') != em_server_realm
  tags: [realm-preflight]

# EVERY DOOR THIS HOST SERVES MUST BE A REDIRECT URI. The list lives in
# `defaults/main.yml` (`em_server_doors`) and it is the SOURCE: adding a page to
# stratigraph-server means adding a line there, and this task is what makes that
# worth doing.
# AND «THE CLIENT IS NOT THERE» IS NOT «THE CLIENT IS MISSING SIX DOORS».
# Measured: with no `em-console` in the realm, the doors task below reported
# «missing 6 of this host's 6 doors» and printed all six. True, and it sends an
# operator to look at a client's redirect list that does not exist. One sentence
# per state.
- name: Refuse a realm with no browser client to sign in through
  ansible.builtin.fail:
    msg: >-
      The realm "{{ em_server_realm_json.realm }}" has no client
      "{{ em_server_console_client }}", so there is nothing for a browser to sign
      in through: every StratiGraph page would answer «invalid client» rather than
      «invalid redirect_uri». It is the PUBLIC client (PKCE, no secret), and it is
      not "{{ em_server_audience }}" — that one is the resource server StratiGraph
      Server validates tokens FOR. Two different things with similar names, which
      is why both are written down in defaults/main.yml. The realm belongs to
      {{ heriverse_repo_url }}, so the client has to be declared there.
  when:
    - em_server_realm_json is defined
    - em_server_console_client not in (em_server_realm_json.clients | default([])
                                       | map(attribute='clientId') | list)
  tags: [realm-preflight]

- name: Work out which doors the realm has never heard of
  ansible.builtin.set_fact:
    em_server_missing_doors: >-
      {{ em_server_doors
         | map('regex_replace', '^', 'https://' ~ server_name)
         | reject('in', (em_server_realm_json.clients | default([])
                         | selectattr('clientId', 'equalto', em_server_console_client)
                         | map(attribute='redirectUris') | flatten))
         | list }}
  when: em_server_realm_json is defined
  tags: [realm-preflight]

- name: Refuse to deploy doors the identity provider will not accept
  ansible.builtin.fail:
    msg: |-
      The realm's "{{ em_server_console_client }}" client is missing {{ em_server_missing_doors | length }} of this host's {{ em_server_doors | length }} doors.
      Caddy will serve them and Keycloak will answer «400 Invalid parameter:
      redirect_uri» to anybody who presses sign in — a page that looks fine until
      it is used.

      Paste these into: realm {{ em_server_realm }} → Clients → {{ em_server_console_client }} → Valid redirect URIs
      {% for uri in em_server_missing_doors %}
          {{ uri }}
      {% endfor %}
      The realm belongs to {{ heriverse_repo_url }} and NOT to this repository, so
      the durable fix is there — a hand edit on the host is overwritten by the
      next import. This play deliberately does not patch it: two copies of a realm
      is a worse defect than a missing door, because then the question stops being
      «which door is missing» and becomes «which realm is right».
  when:
    - em_server_realm_json is defined
    - em_server_missing_doors | default([]) | length > 0
  tags: [realm-preflight]
# ───────────────────────────────────────────────────────────────────────────────

# IL NOME DEL FILE, e non la cartella che lo contiene.
#
# `dest` era la DIRECTORY in tutte e due questi compiti, e con una directory
# `ansible.builtin.template` chiama il file come il SORGENTE: scriveva
# `docker-compose.yml.j2` e `Caddyfile.j2` ACCANTO ai file veri, che restavano
# quelli del clone. Il template si rendeva benissimo — zero marcatori Jinja nel
# risultato — e non serviva a niente: `docker compose up` leggeva il
# `docker-compose.yml` di upstream, quindi il ruolo non ha mai messo in piedi
# nessun servizio StratiGraph, né il Postgres dei documenti, e Caddy serviva la
# configurazione del clone.
#
# Misurato la prima volta che questo ruolo è stato eseguito (15-09-2026): il
# compose che partiva aveva sette servizi — keycloak, minio, postgres, couchdb,
# heriverse-server, heriverse, caddy — e nessuno dei nostri. Il difetto si
# vedeva solo dalle IMMAGINI che tentava di tirare giù (`postgres:18`,
# `keycloak:26.6.2`), che sono quelle di upstream e non quelle dei defaults.
- name: Replace docker-compose.yml for prod
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ heriverse_checkout }}/docker-compose.yml"
    owner: root
    group: root
    force: true
    mode: '0644'

- name: Replace default Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ heriverse_checkout }}/mount/caddy/Caddyfile"
    owner: root
    group: root
    mode: '0644'

- name: Create and start all Heriverse services
  community.docker.docker_compose_v2:
    project_src: "{{ heriverse_checkout }}"
    pull: missing
  register: output

# ───────────────────────────────────────────────────────────────────────────────
# THE MOVING HAND — a node that existed before the documents had a house
# ───────────────────────────────────────────────────────────────────────────────
#
# Postgres starts empty. A node deployed before this change has its documents on
# the volume as `<room>.em.json`, and without this step those rooms reopen
# **empty**: the relay asks the store for the document and the new store has
# never seen those files. Measured in the dev stack — 122 documents on the
# volume, zero rows in the table, 122 rooms that would have restarted from an
# empty container.
#
# It is idempotent BY CONSTRUCTION and not by a flag: a project that already has
# rows is not touched, so a second run finds everything already present and
# writes nothing. Running the playbook twice is therefore safe, which is the only
# property that makes a migration step acceptable inside a playbook people rerun.
#
# It inserts THE FILE'S OWN BYTES rather than re-serialising through `put`:
# otherwise the criterion this whole table exists for — bytes in, the same bytes
# out — would hold from tomorrow on and not for what was already there.
#
# The files are NOT deleted here. Verifying and removing them is a separate,
# explicit gesture (`--verify --remove-verified`), for a human who has read the
# result: in that directory live six other registers, and the oplog still does.

- name: Bring documents that are already on the volume into the table
  # `docker compose exec` through `ansible.builtin.command`, the same way this
  # role already runs `./entrypoint.sh` below, and NOT
  # `community.docker.docker_compose_v2_exec`: that module exists in recent
  # versions of the collection, but this role only ever proves it needs
  # `docker_compose_v2`, and a task that quietly raises the required collection
  # version fails on somebody else's control node with a message about a module
  # rather than about a deploy. `-T` because there is no terminal here.
  ansible.builtin.command:
    chdir: "{{ heriverse_checkout }}"
    cmd: >-
      docker compose exec -T -w /srv/em-server stratigraph-server
      python -m app.documents --from {{ em_server_snapshot_dir }}
  register: em_documents_migration
  # `rc == 0` E il conteggio, e la prima metà non c'era. Senza di essa un
  # trasloco FALLITO dichiarava `changed`: lo strumento sollevava, `stdout`
  # restava vuoto, e «`traslocati   : 0` non è in ''» è vero — quindi il compito
  # diceva di aver cambiato qualcosa mentre non era partito affatto.
  #
  # Misurato spostando la directory degli snapshot (15-09-2026): playbook verde,
  # `failed=0`, il compito `changed`, e da nessuna parte il
  # `FileNotFoundError: non c'è nessuna directory /srv/em-data/snapshots`.
  changed_when:
    - em_documents_migration.rc == 0
    - "'traslocati   : 0' not in (em_documents_migration.stdout | default(''))"
  # A node that has never held a document has nothing to move, and the tool says
  # so with `traslocati: 0` rather than failing. A node whose snapshot directory
  # does not exist yet is the same case, and the tool raises — so the failure is
  # tolerated and REPORTED instead of stopping a deploy that is otherwise fine.
  #
  # «Tollerato e RIFERITO»: era vero solo per metà. Il compito qui sotto stampava
  # `stdout`, che in caso di errore è VUOTO, quindi l'operatore leggeva una riga
  # bianca dentro una corsa verde. Ora dice cosa è andato storto.
  failed_when: false
  when:
    - em_server_enabled | default(false)
    - em_documents_enabled | default(false)
    - em_documents_migrate_existing | default(true)

- name: Say what the moving hand did
  ansible.builtin.debug:
    msg: >-
      {{ em_documents_migration.stdout | trim
         if (em_documents_migration.stdout | default('') | trim)
         else ('IL TRASLOCO NON È PARTITO (rc='
               ~ (em_documents_migration.rc | default('?'))
               ~ '). Non è stato spostato niente, e le stanze che hanno il loro '
               ~ 'documento sul volume si riapriranno VUOTE. Ha detto: '
               ~ (em_documents_migration.stderr | default('')
                  | trim | regex_replace('\\s+', ' '))[-300:]) }}
  when: em_documents_migration is defined

- name: Execute entrypoint script
  ansible.builtin.command:
    chdir: "{{ heriverse_checkout }}"
    cmd: './entrypoint.sh'
  become: true
  become_user: heriverse
  
