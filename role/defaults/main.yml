heriverse_repo_url: "https://git.3dresearch.it/stratigraph/docker-heriverse"
# Note: replace with the actual domain name for Caddy config
server_name: "heriverse.example.com"

# ---------------------------------------------------------------------------
# StratiGraph service — StratiGraph Server + its object store (DRAFT, see the header of
# docker-compose.yml.j2 for what has to be agreed with 3DR).
#
# StratiGraph Server is the ROOM: it holds a project's graph and the assets that project
# points at (models, orthophotos). It is a resource server — it never logs
# anybody in — so it is pointed at the SAME Keycloak realm this stack already
# runs, and shares its users, groups and revocations for free.
# ---------------------------------------------------------------------------
em_server_enabled: true
em_server_image: "git.3dresearch.it:5050/stratigraph/stratigraph-server:latest"
em_server_port: 8000

# The realm StratiGraph Server validates tokens against. Derived from the same
# TOKEN_ENDPOINT Heriverse already configures, rather than a second spelling of
# the same URL — two configs for one realm is how one of them ends up wrong.
em_server_realm: "heriverse"
em_server_token_endpoint: "https://{{ server_name }}/auth/realms/{{ em_server_realm }}/protocol/openid-connect/token"
# The audience StratiGraph Server requires in a token. Set it, or StratiGraph Server refuses to
# start: a half-configured deployment that fell back to open would be a service
# everybody believes is protected.
em_server_audience: "em-server"

# Where a room's document is written. A directory on a volume today; the same
# interface takes an object store when there is more than one replica.
em_server_snapshot_dir: "/srv/em-data/snapshots"
# …and where the assets themselves go while MinIO is infrastructure-only (see
# the compose template). Both live on the same volume: they are the same study.
em_server_asset_dir: "/srv/em-data/assets"

# ---------------------------------------------------------------------------
# StratiGraph service — StratiGraph Catalog (the REGISTER of studies)
#
# The other half of what StratiGraph publishes, and a different question from
# StratiGraph Server's: StratiGraph Server serves the ROOM (the graph being edited right now),
# StratiGraph Catalog serves the STUDY (the container as published). One bucket, two
# prefixes; one realm, two audiences if you want them separate.
#
# The founding rule, which is what makes this safe to deploy: **the studies are
# the containers in the object store, and the index is a projection of them**.
# Losing the index costs one `POST /catalog/reindex`; it is never a second copy
# of the truth. See stratigraph-catalog/README.md.
# ---------------------------------------------------------------------------
em_catalog_enabled: true
em_catalog_image: "git.3dresearch.it:5050/stratigraph/stratigraph-catalog:latest"
em_catalog_port: 8010
# Same realm as StratiGraph Server. A separate audience is allowed (a client per service
# is the tidier Keycloak arrangement) but not required — set it to the same
# value and one token opens both.
em_catalog_audience: "em-server"
# The DEPLOY index: the CouchDB this stack already runs, with a database of its
# own beside Heriverse's `scene` documents (spec §7 — a new document type, not
# an inflation of sceneController). Set `em_catalog_couchdb_enabled: false` to
# fall back to the SQLite dev index on the volume below; it is chosen by being
# configured, never silently.
em_catalog_couchdb_enabled: true
em_catalog_couchdb_database: "em-catalog"
# NO CREDENTIALS HERE — same rule as MinIO. Provide `couchdb_user` /
# `couchdb_password` from the inventory or the Vault; the template fails loudly
# if the CouchDB index is enabled and they are missing.
# couchdb_user: "…"
# couchdb_password: "…"
em_catalog_db_path: "/srv/em-catalog-data/index.sqlite"
# ---------------------------------------------------------------------------
# EMStudio, SERVED BY THIS NODE (the editor and the dissemination reader)
#
# A path on the host holding EMStudio's built `dist/` — `index.html` (the editor,
# one self-contained file) and `reader.html` plus `assets/` (the reader). Caddy
# serves them at `/em/studio/` and `/em/read/`.
#
# **Empty by default, and that is the same decision as `em_catalog_reader_dist`
# below**: how a built front end reaches a production host is WP6's pipeline to
# build, and this role's job is to be CAPABLE of serving it rather than to invent
# a build step. Left empty → no routes at all, and `em_catalog_emstudio_url`
# should then name wherever EMStudio actually is.
#
# Why it wants to be on THIS origin: the editor fetches a study container from
# the Catalog, and a different origin means the browser refuses (the Catalog
# sends no CORS headers, deliberately — see the Caddyfile). Measured in a
# browser, not deduced.
em_studio_dist: ""

# Where EMStudio lives, for the "open in…" deep links. Only ever WRITTEN into an
# answer — StratiGraph Catalog never dials it.
#
# Defaults to THIS node's own EMStudio route, because that is the arrangement
# that works: same origin as the Catalog, so the editor can fetch the container
# it was handed. Point it elsewhere and the button still appears — and the fetch
# behind it will need that origin to be allowed, by name, on the Catalog.
em_catalog_emstudio_url: "https://{{ server_name }}/em/studio"
# The dissemination READER — EMStudio's built viewer, which StratiGraph Catalog serves at
# `/catalog/reader/` so that `/catalog/study/{id}/narrative` is a page and not a
# 501. A path ON THE HOST, mounted read-only into the container.
#
# **Empty by default, and that is a decision.** How the built reader gets onto a
# production host is WP6's pipeline to build (CNR writes the spec, 3DR builds);
# this role's job is to be *capable* of serving it, not to invent a build step.
# Left empty: no env, no mount, and the narrative route answers an honest 501
# naming the build command — exactly what it does today, unchanged.
#
# What to put there: the `dist/` produced by `npm run build:reader` in EMStudio
# — the shell AND its `assets/`, together. Not `reader.html` alone: the reader
# gave up its single-file build so the 3D engine could be a chunk fetched only
# when a model appears. Its asset paths are relative, so it works under any
# prefix without being rebuilt for this deployment.
#
#   em_catalog_reader_dist: "/opt/heriverse/reader-dist"
em_catalog_reader_dist: ""

# --- images (IIIF) ---------------------------------------------------------
# Cantaloupe serves the IIIF Image API straight from the asset bucket, with the
# asset's sha256 as the identifier: no second copy of the pixels, no thumbnail
# pipeline to keep in sync. Thumbnails, deep zoom and region crops all become
# size/region requests on an image that is already there.
iiif_enabled: true
# EMBARGO GATE on the image path. With it on, Caddy asks StratiGraph Server before every
# `/iiif/*` request (`forward_auth` → `/v1/iiif-authz`), so an image under a
# running embargo is refused even to somebody who already has its sha256 — the
# hole that stays open otherwise, because Cantaloupe reads the bucket directly
# and StratiGraph Server is not in the path of a pixel.
#
# OFF by default. Turning it on puts StratiGraph Server in front of every image request:
# that is a latency and an availability decision for whoever runs the host, and
# a template should not make it for them. Off = the behaviour that was there
# before this existed.
iiif_embargo_gate: false
cantaloupe_image: "islandora/cantaloupe:main"
cantaloupe_port: 8182

# --- the field assistant (chatbot) -----------------------------------------
# The voice in the trench: somebody with their hands in the soil says "crea una
# nuova scheda" and a unit appears in the graph. It is a PWA, so what it needs
# from this deployment is not a runtime — it is an ORIGIN. Camera, microphone and
# GPS are offered by a browser only to a secure context, so on a phone the
# assistant is useless anywhere except behind this stack's https. That is the
# whole reason it is a service here rather than something somebody runs by hand.
#
# ON by default, unlike the photogrammetric engine: it is a small Python service,
# not three gigabytes and hours of CPU, and a StratiGraph node without a field
# client is a node missing the half that faces the excavation.
em_chatbot_enabled: true
# NOT VERIFIED IN THE REGISTRY: `git.3dresearch.it:5050` answers 401 to an
# unauthenticated tag listing for ANY repository name, so "it is there" and "it is
# not" look identical from outside. This follows the convention the two names
# above follow (`stratigraph/<repo>:latest`). Check with:
#   docker manifest inspect git.3dresearch.it:5050/stratigraph/stratigraph-chatbot:latest
em_chatbot_image: "git.3dresearch.it:5050/stratigraph/stratigraph-chatbot:latest"

# Where what was said ends up. A container on a volume — see the room note below
# for why that is the DEFAULT and not a limitation.
em_chatbot_container: "/srv/chatbot-data/scavo.em.json"
em_chatbot_study: "Scavo"

# THE ROOM IS OPTIONAL, AND THE TOKEN IS NOT CONFIGURATION.
#
# Left as they are, the assistant writes to its own container on the volume
# above: everything recorded is kept, nothing is shared live. Point it at a room
# and what is said appears in EMStudio as it is said.
#
# But it refuses to start with a room and no token — «the assistant writes as a
# verified person or it does not write» — and a JWT in these defaults, or in an
# inventory, would be a credential dressed up as a variable: readable by whoever
# reads the repo, and alive long after the reason it was issued. So the operator
# makes that choice explicitly, and the credential comes from Vault:
#
#   em_chatbot_server_url: "http://stratigraph-server:8000"   # INTERNAL: beside it
#   em_chatbot_room: "cantiere-2026"
#   em_chatbot_token: "{{ vault_em_chatbot_token }}"          # never in plain text
#
# The URL is the internal one: the assistant dials a service on the same network,
# and routing it back out through Caddy would make it depend on the proxy to
# reach a neighbour.
em_chatbot_server_url: ""
em_chatbot_room: ""
em_chatbot_token: ""

em_chatbot_port: 8020

# --- photogrammetry (NodeODM) ----------------------------------------------
# The engine behind the processing connector: a cluster of photographs posted by
# a field node becomes a placed 3D model, with its provenance in the graph. NOT
# our code — a pulled dependency (MIT), driven over three REST endpoints by
# s3Dgraphy's connector, which is the only bespoke part.
#
# OFF by default. It is a ~3 GB image and hours of CPU per site, and a host that
# only serves Heriverse should not pay for an engine nobody asked for. Turning it
# on is a decision about what this node is FOR.
nodeodm_enabled: false
# PINNED, never `latest`. 3.5.6 is the newest semver tag published for both
# amd64 and arm64 (checked on the registry, 2026-08-29), which is what makes it
# native on an Apple-Silicon Field Computing Node. Updating is deliberate: raise
# this, then `docker compose pull nodeodm && docker compose up -d nodeodm`.
nodeodm_image: "opendronemap/nodeodm:3.5.6"
# NOT published through Caddy, and not a host port either: the engine speaks no
# auth of its own, so the only thing that may reach it is StratiGraph Server on
# the backend network. This is the port INSIDE that network.
nodeodm_port: 3000
# What StratiGraph Server dials. An ENDPOINT, not a host: point it at a ClusterODM
# broker and the same three endpoints route small jobs to this CPU worker and
# large ones to a GPU one, with no code change. Left as the local service by
# default because that is what this playbook deploys.
nodeodm_url: "http://nodeodm:{{ nodeodm_port }}"

# --- object store (MinIO) --------------------------------------------------
# The production implementation of StratiGraph Server's AssetStore: assets are
# content-addressed (the reference IS the sha256 of the bytes), so dedup is
# free and any client can verify what it fetched.
minio_enabled: true
minio_image: "quay.io/minio/minio:latest"
minio_bucket: "em-assets"
minio_api_port: 9000
minio_console_port: 9001
# NO CREDENTIALS HERE. Provide them from the inventory, an Ansible Vault file or
# the environment — a secret in a repository is a secret that has already
# leaked. The template fails loudly if they are missing.
# minio_root_user: "…"
# minio_root_password: "…"
